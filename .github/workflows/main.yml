name: Deploy Cloud Monitoring App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn
    
    - name: Run tests
      run: |
        # Add test commands here if you have any
        echo "Running tests..."

    # Generate a static version with screenshots for GitHub Pages
    - name: Generate static preview
      run: |
        mkdir -p static_preview
        echo '<!DOCTYPE html>
        <html>
        <head>
            <title>Cloud Monitoring App Preview</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
            <style>
                .container { max-width: 800px; margin: 0 auto; padding: 20px; }
                .preview-img { max-width: 100%; border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; }
                .github-btn { display: inline-block; padding: 10px 20px; background-color: #24292e; color: white; 
                              text-decoration: none; border-radius: 6px; font-weight: bold; }
                .deploy-info { background-color: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; }
                code { background-color: #f1f1f1; padding: 2px 5px; border-radius: 3px; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1 class="my-4">Cloud Monitoring App</h1>
                <p>This is a Flask application for monitoring system resources. It provides real-time metrics for CPU and memory usage.</p>
                
                <div class="alert alert-info">
                    <strong>Note:</strong> This is a static preview. The actual application requires a server to run.
                </div>
                
                <h2>Preview</h2>
                <img src="app_preview.png" alt="Application Preview" class="preview-img">
                
                <div class="deploy-info">
                    <h3>Deployment Instructions</h3>
                    <p>To run this application locally:</p>
                    <ol>
                        <li>Clone the repository</li>
                        <li>Install dependencies: <code>pip install -r requirements.txt</code></li>
                        <li>Run the app: <code>python app.py</code></li>
                    </ol>
                    
                    <h3>Server Deployment</h3>
                    <p>For production deployment, consider using:</p>
                    <ul>
                        <li>Heroku</li>
                        <li>AWS Elastic Beanstalk</li>
                        <li>Google Cloud Run</li>
                        <li>Digital Ocean App Platform</li>
                    </ul>
                </div>
                
                <a href="https://github.com/${{ github.repository }}" class="github-btn">View on GitHub</a>
            </div>
        </body>
        </html>' > static_preview/index.html
        
        # Install additional tools for taking screenshots
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf xvfb
        python -c 'import plotly.graph_objects as go; fig = go.Figure(go.Indicator(mode = "gauge+number", value = 35, gauge = {"axis": {"range": [None, 100]}, "steps": [{"range": [0, 50], "color": "#d9f0a3"}, {"range": [50, 85], "color": "#ffeb84"}, {"range": [85, 100], "color": "#ff5f5f"}]}, title = {"text": "CPU Utilization"})); fig.write_image("static_preview/app_preview.png", width=800, height=400)'
        
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: static_preview
        branch: gh-pages
